# herdr is not packaged for apt; installed via its own install script,
# see https://herdr.dev

- name: herdr | Check if herdr is already installed
  command: which herdr
  register: herdr_installed
  failed_when: false
  changed_when: false

- name: herdr | Install herdr
  shell: curl -fsSL https://herdr.dev/install.sh | sh
  when: herdr_installed.rc != 0

- name: herdr | Ensure destination exists for herdr config
  file:
    path: $HOME/.config/herdr
    state: directory

- name: herdr | Configure herdr
  copy:
    src: herdr/config.toml
    dest: $HOME/.config/herdr/config.toml
