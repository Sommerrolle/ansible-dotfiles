############################
####### KEYBDINGINDS #######
############################

# modifyer key to space instead of b
unbind C-b
set -g prefix C-Space

# use r to reload tmux confg and display a message afterwards
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# enable mouse mode for selecting windows, scrolling, resizing panes, copying text
# -g flag means global for alle sessions, windows, panes
set -g mouse on

# use v and h to split window in multiple panes
unbind v
unbind h

unbind % # Split vertically
unbind '"' # Split horizontally

bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Resizing panes
# prefix key -> ALT + ARROW key

# Navigating panes with vim motions
# -n flag indicating dont use prefix key for these keystrokes
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# more history
set -g history-limit 10000

# Opening tmux windows
unbind n  #DEFAULT KEY: Move to next window
unbind w  #DEFAULT KEY: change current window interactively

bind n command-prompt "rename-window '%%'"
bind w new-window -c "#{pane_current_path}"

# Select different window with prefix key -> number
# Start numbering windows and panes with 1 instead of 0, rip IT
set -g base-index 1
set-window-option -g pane-base-index 1

# no prefix key and just ALT j/k for previous and next window
bind -n M-j previous-window
bind -n M-k next-window

# vim motions in copy mode
set-window-option -g mode-keys vi

# ctrl-u , scroll up
# ctrl-d , scroll down
# / , search

# use v and y instead of space and enter for selecting and copy like in vim
unbind -T copy-mode-vi Space; #Default for begin-selection
unbind -T copy-mode-vi Enter; #Default for copy-selection

# copy to clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel --clipboard"

